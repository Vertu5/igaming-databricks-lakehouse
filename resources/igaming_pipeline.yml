resources:
  jobs:
    igaming_pipeline:
      name: igaming-pipeline-${bundle.target}
      description: Medallion pipeline (Bronze, Silver, Gold). Each layer is followed by a data quality gate.
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/01_bronze.sql
            parameters: &params
              catalog: ${var.catalog}
              schema: ${var.schema}
              sample_mod: ${var.sample_mod}

        - task_key: test_bronze
          depends_on:
            - task_key: bronze
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/quality/test_bronze.sql
            parameters: *params

        - task_key: silver
          depends_on:
            - task_key: test_bronze
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/02_silver.sql
            parameters: *params

        - task_key: test_silver
          depends_on:
            - task_key: silver
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/quality/test_silver.sql
            parameters: *params

        - task_key: gold
          depends_on:
            - task_key: test_silver
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/03_gold.sql
            parameters: *params

        - task_key: test_gold
          depends_on:
            - task_key: gold
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/quality/test_gold.sql
            parameters: *params
